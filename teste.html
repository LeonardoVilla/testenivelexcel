
<!DOCTYPE html>
<html>
<head>
  <title>Classificação de Candidato</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Link para o Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light mb-2">

  <div class="container mt-2" style="max-width: 700px;">
    <div class="container text-center my-4">
      <img src="https://extranet.portaldaindustria.com.br/Content/img/senai-logo.svg" alt="Logo" class="img-fluid" style="max-width: 300px;">
    </div>
    <div class="row">
      <div class="col">
        <div class="card shadow">
          <div class="card-header bg-primary text-white">
            <div class="row">
              <div class="col">
                <h4>Classificação de Candidato</h4>
              </div>
              <div class="col text-end">
                <a href="index.html" class="btn btn-light">
                  <i class="bi bi-house"></i>
                </a>
              </div>
            </div>
          </div>
          <div class="card-body">
            <form id="consultaForm" class="mb-3">
              <div class="mb-3">
                <label for="email" class="form-label form-label-strong"><strong>Digite seu e-mail:</strong></label>
                <input type="email" class="form-control" id="email" placeholder="exemplo@dominio.com" required>
              </div>
              <button type="submit" class="btn btn-primary">Buscar</button>
            </form>
            <div id="resultado"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Script para interagir com o Apps Script -->
  <script>
    document.getElementById('consultaForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;

      fetch(`https://script.google.com/macros/s/AKfycbzP_6vBmZbTL5N28KtK7CoSWIh597xGChUBPl1DSwq7XdUZ5LRSTosW8DOK8PdaiRO7wA/exec?email=${email}`)
        .then(response => response.text())
        .then(data => {
          document.getElementById('resultado').innerHTML = data;
        })
        .catch(error => console.error('Erro:', error));
    });
  </script>
